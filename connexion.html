<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion | Le Grand Cinéma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Limelight&family=Monoton&family=Work+Sans:wght@400;500;600;700&family=Josefin+Sans:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header id="header-site"></header>
    <main>
      <h1>Connexion</h1>
      <form id="formulaire-connexion" class="formulaire carte" novalidate>
        <div
          id="alerte-formulaire"
          class="alerte alerte-erreur masque"
          role="alert"
        ></div>
        <div class="champ">
          <label for="email">Adresse email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            aria-describedby="message-email"
          />
          <p id="message-email" class="message-champ"></p>
        </div>
        <div class="champ">
          <label for="motDePasse">Mot de passe</label>
          <input
            type="password"
            id="motDePasse"
            name="motDePasse"
            autocomplete="current-password"
            aria-describedby="message-motDePasse"
          />
          <p id="message-motDePasse" class="message-champ"></p>
        </div>
        <button type="submit" id="bouton-formulaire" class="btn btn-large">
          Se connecter
        </button>
        <p>
          Pas encore de compte ? <a href="/inscription.html">Créer un compte</a>
        </p>
      </form>
    </main>
    <footer id="footer-site"></footer>
    <script type="module" src="/js/layout.js"></script>
    <script type="module" src="/js/connexion.js"></script>
  </body>
</html>
