<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Films à l'affiche | Le Grand Cinéma</title>
    <meta
      name="description"
      content="Le Grand Cinéma à Nancy : découvrez les films à l'affiche et réservez votre place en ligne, sans faire la queue."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Le Grand Cinéma" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Films à l'affiche | Le Grand Cinéma" />
    <meta property="og:description" content="Le Grand Cinéma à Nancy : découvrez les films à l'affiche et réservez votre place en ligne, sans faire la queue." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Limelight&family=Work+Sans:wght@400;500;600;700&family=Josefin+Sans:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/films.css" />
  </head>
  <body>
    <header id="header-site"></header>
    <main>
      <div class="entete-films">
        <div>
          <p class="accroche-cinema">Depuis 1964 · Nancy</p>
          <h1 id="titre-films">Films à l'affiche</h1>
        </div>
        <section id="filtres-films" aria-label="Filtrer les films">
          <div class="champ">
            <label for="filtre-genre">Genre</label>
            <select id="filtre-genre" name="filtre-genre">
              <option value="">Tous les genres</option>
            </select>
          </div>
        </section>
      </div>
      <div
        id="alerte-films"
        class="alerte alerte-erreur masque"
        role="alert"
      ></div>
      <output id="etat-vide" class="masque"></output>
      <ul id="grille-films"></ul>
    </main>
    <footer id="footer-site"></footer>
    <script type="module" src="/js/layout.js"></script>
    <script type="module" src="/js/index.js"></script>
  </body>
</html>
