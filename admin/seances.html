<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Séances | Administration | Le Grand Cinéma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Limelight&family=Monoton&family=Work+Sans:wght@400;500;600;700&family=Josefin+Sans:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body>
    <header id="header-site"></header>
    <main>
      <h1>Séances</h1>

      <p id="chargement" role="status">Chargement des séances…</p>

      <section
        id="section-seances"
        class="masque"
        aria-label="Programmation des séances"
      >
        <div
          id="message-succes"
          class="alerte alerte-succes masque"
          role="status"
        ></div>
        <div class="barre-admin">
          <label class="case-a-cocher">
            <input type="checkbox" id="afficher-passees" />
            Afficher les séances passées
          </label>
          <button type="button" id="bouton-ajouter-seance" class="btn">
            Ajouter une séance
          </button>
        </div>
        <div id="tableau-seances" class="carte tableau-admin">
          <table>
            <thead>
              <tr>
                <th scope="col">Date</th>
                <th scope="col">Heure</th>
                <th scope="col">Film</th>
                <th scope="col">Salle</th>
                <th scope="col">Prix</th>
                <th scope="col">Places libres</th>
                <th scope="col" class="colonne-actions">
                  <span class="visible-lecteur-ecran">Actions</span>
                </th>
              </tr>
            </thead>
            <tbody id="corps-tableau-seances"></tbody>
          </table>
        </div>
        <p id="etat-vide-seances" class="carte etat-vide-admin masque">
          Aucune séance à venir.
        </p>
        <p id="etat-vide-passees" class="carte etat-vide-admin masque">
          Aucune séance passée.
        </p>
      </section>

      <section id="zone-erreur" class="masque">
        <h2>Un petit entracte</h2>
        <div
          id="message-erreur"
          class="alerte alerte-erreur"
          role="alert"
        ></div>
        <button type="button" id="bouton-recharger" class="btn">
          Recharger la page
        </button>
      </section>

      <template id="template-ligne-seance">
        <tr>
          <td class="cellule-date"></td>
          <td class="cellule-horaire"></td>
          <td class="cellule-titre"></td>
          <td class="cellule-salle"></td>
          <td class="cellule-prix"></td>
          <td class="cellule-places"></td>
          <td class="colonne-actions">
            <button
              type="button"
              class="btn btn-secondaire btn-petit bouton-modifier"
            >
              Modifier
            </button>
            <button
              type="button"
              class="btn btn-supprimer btn-petit bouton-supprimer"
            >
              Supprimer
            </button>
          </td>
        </tr>
      </template>

      <dialog
        id="fenetre-seance"
        class="fenetre-admin"
        aria-labelledby="titre-fenetre-seance"
      >
        <form id="formulaire-seance" class="formulaire" novalidate>
          <h2 id="titre-fenetre-seance">Nouvelle séance</h2>
          <div
            id="alerte-formulaire"
            class="alerte alerte-erreur masque"
            role="alert"
          ></div>
          <div class="champ">
            <label for="filmId">Film</label>
            <select id="filmId" name="filmId" aria-describedby="message-filmId">
              <option value="">Choisir un film</option>
            </select>
            <p id="message-filmId" class="message-champ"></p>
          </div>
          <div class="champ">
            <label for="salleId">Salle</label>
            <select
              id="salleId"
              name="salleId"
              aria-describedby="note-salle message-salleId"
            >
              <option value="">Choisir une salle</option>
            </select>
            <p id="note-salle" class="aide-champ masque">
              Pour changer la salle, supprimez la séance et recommencez.
            </p>
            <p id="message-salleId" class="message-champ"></p>
          </div>
          <div class="champ">
            <label for="dateHeure">Date et heure</label>
            <input
              type="datetime-local"
              id="dateHeure"
              name="dateHeure"
              aria-describedby="fin-prevue message-dateHeure"
            />
            <p id="fin-prevue" class="aide-champ masque"></p>
            <p id="message-dateHeure" class="message-champ"></p>
          </div>
          <div class="champ">
            <label for="prix">Prix (en euros)</label>
            <input
              type="number"
              id="prix"
              name="prix"
              min="0.01"
              step="0.01"
              inputmode="decimal"
              aria-describedby="message-prix"
            />
            <p id="message-prix" class="message-champ"></p>
          </div>
          <div class="boutons-fenetre">
            <button
              type="button"
              id="bouton-annuler-seance"
              class="btn btn-secondaire"
            >
              Annuler
            </button>
            <button type="submit" id="bouton-formulaire" class="btn">
              Enregistrer
            </button>
          </div>
        </form>
      </dialog>

      <dialog
        id="fenetre-suppression"
        class="fenetre-admin"
        aria-labelledby="titre-fenetre-suppression"
        aria-describedby="texte-suppression"
      >
        <h2 id="titre-fenetre-suppression">
          Supprimer la séance de « <span id="film-seance-a-supprimer"></span> »
          du <span id="horaire-seance-a-supprimer"></span> ?
        </h2>
        <p id="texte-suppression">Cette action est irréversible.</p>
        <div
          id="alerte-suppression"
          class="alerte alerte-erreur masque"
          role="alert"
        ></div>
        <div class="boutons-fenetre">
          <button
            type="button"
            id="bouton-annuler-suppression"
            class="btn btn-secondaire"
            autofocus
          >
            Annuler
          </button>
          <button
            type="button"
            id="bouton-confirmer-suppression"
            class="btn btn-supprimer"
          >
            Supprimer
          </button>
        </div>
      </dialog>
    </main>
    <footer id="footer-site"></footer>
    <script type="module" src="/js/layout.js"></script>
    <script type="module" src="/js/admin-seances.js"></script>
  </body>
</html>
